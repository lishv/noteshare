# 负载均衡 nginx 配置 — 多后端实例部署
# 使用方法: nginx -c conf/nginx-lb.conf
# 后端实例通过 start-cluster.bat 启动在 8081/8082/8083

worker_processes  auto;

events {
    worker_connections  2048;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    client_max_body_size 10m;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" upstream=$upstream_addr';

    # 后端服务集群 — 轮询 + 权重
    upstream backend {
        # IP Hash: 同一客户端IP始终路由到同一后端（适合会话粘滞）
        ip_hash;

        server localhost:8081 weight=1;
        server localhost:8082 weight=1;
        server localhost:8083 weight=1;

        # 备用节点: 当上面全部不可用时才启用
        # server localhost:8080 backup;

        keepalive 32;
    }

    # ========== 用户端前端 (端口 80) ==========
    server {
        listen       80;
        server_name  localhost;

        access_log  logs/user-access.log  main;
        error_log   logs/user-error.log;

        location = / {
            return 302 /login;
        }

        location / {
            root   ../note-frontend/user/dist;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        location ^~ /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }

    # ========== 管理端前端 (端口 81) ==========
    server {
        listen       81;
        server_name  localhost;

        access_log  logs/admin-access.log  main;
        error_log   logs/admin-error.log;

        location = / {
            return 302 /login;
        }

        location / {
            root   ../note-frontend/admin/dist;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        location ^~ /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }
}
